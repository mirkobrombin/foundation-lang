name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang-21
            cxx: clang++-21
          - name: macOS AppleClang
            os: macos-15
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false


      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: false

      - name: Install LLVM 21 on Linux
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install --no-install-recommends -y llvm-21-dev
          echo "LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install LLVM 21 on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install llvm@21
          echo "LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake --preset dev
          -DLLVM_DIR="$LLVM_DIR"

      - name: Build
        run: cmake --build --preset dev

      - name: Test three times
        run: |
          ctest --preset dev
          ctest --preset dev
          ctest --preset dev

  windows:
    name: Windows MSVC
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false


      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: false

      - name: Install LLVM 21
        shell: pwsh
        run: |
          choco upgrade llvm --version=21.1.8 --allow-downgrade --no-progress -y
          "LLVM_DIR=C:\Program Files\LLVM\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/windows -A x64
          -DBUILD_TESTING=ON
          -DFOUNDATION_WARNINGS_AS_ERRORS=ON
          "-DLLVM_DIR=$env:LLVM_DIR"

      - name: Build
        run: cmake --build build/windows --config Debug

      - name: Test three times
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64
          ctest --test-dir build/windows -C Debug --output-on-failure
          ctest --test-dir build/windows -C Debug --output-on-failure
          ctest --test-dir build/windows -C Debug --output-on-failure

  fuzz:
    name: Parser fuzz and sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false


      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: false

      - name: Install LLVM 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install --no-install-recommends -y llvm-21-dev

      - name: Configure
        env:
          CC: clang-21
          CXX: clang++-21
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DFOUNDATION_WARNINGS_AS_ERRORS=ON
          -DFOUNDATION_BUILD_FUZZERS=ON
          -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build
        run: cmake --build build/fuzz

      - name: Run compiler tests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:symbolize=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=0
        run: ctest --test-dir build/fuzz --output-on-failure

      - name: Fuzz parser
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:symbolize=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=0
        run: >-
          ./build/fuzz/foundation_parser_fuzz
          -max_total_time=10
          -verbosity=0
          build/fuzz/fuzz-corpus
