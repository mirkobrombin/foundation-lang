name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${TAG#v}"
          grep -Fq "project(foundation_lang VERSION $version " CMakeLists.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --generate-notes --title "Foundation ${GITHUB_REF_NAME#v}"
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            cc: gcc
            cxx: g++
            llvm-archive: LLVM-21.1.8-Linux-X64.tar.xz
            llvm-sha256: b3b7f2801d15d50736acea3c73982994d025b01c2f035b91ae3b49d1b575732b
          - name: macOS
            os: macos-15
            platform: macos
            cc: clang
            cxx: clang++
            llvm-archive: LLVM-21.1.8-macOS-ARM64.tar.xz
            llvm-sha256: b95bdd32a33a81ee4d40363aaeb26728a26783fcef26a4d80f65457433ea4669
          - name: Windows x86_64
            os: windows-2025
            platform: windows
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout Foundation v2 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mirkobrombin/go-foundation
          ref: 06679f06495151fbd0d491e76121ba98b939a291
          path: build/go-foundation-v2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: false

      # Official archives provide static LLVM libraries, so the SDK binaries do not need an LLVM
      # install. The libraries are LLVM bitcode, which only the bundled lld can link.
      - name: Install LLVM 21 on Unix
        if: runner.os != 'Windows'
        env:
          LLVM_ARCHIVE: ${{ matrix.llvm-archive }}
          LLVM_SHA256: ${{ matrix.llvm-sha256 }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install --no-install-recommends -y zlib1g-dev libzstd-dev libxml2-dev
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install zstd
          fi
          archive="$RUNNER_TEMP/$LLVM_ARCHIVE"
          root="$RUNNER_TEMP/llvm-21.1.8"
          curl -fsSL -o "$archive" "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/$LLVM_ARCHIVE"
          if [ "$(cmake -E sha256sum "$archive" | cut -d ' ' -f 1)" != "$LLVM_SHA256" ]; then
            echo "LLVM archive checksum mismatch" >&2
            exit 1
          fi
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root" --strip-components=1
          rm "$archive"
          echo "LLVM_DIR=$root/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM_ROOT=$root" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          fi

      - name: Install LLVM 21 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llvm-21.1.8-windows.tar.xz"
          $root = Join-Path $env:RUNNER_TEMP "llvm-21.1.8"
          Invoke-WebRequest -Uri https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang%2Bllvm-21.1.8-x86_64-pc-windows-msvc.tar.xz -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne "749d22f565fcd5718dbed06512572d0e5353b502c03fe1f7f17ee8b8aca21a47") {
            throw "LLVM archive checksum mismatch"
          }
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xJf $archive -C $root --strip-components=1
          "LLVM_DIR=$root\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Unix
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            linker="-B$LLVM_ROOT/bin -fuse-ld=lld"
          else
            linker="--ld-path=$LLVM_ROOT/bin/ld64.lld"
          fi
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DLLVM_DIR="$LLVM_DIR" \
            "-DCMAKE_EXE_LINKER_FLAGS=$linker" \
            "-DCMAKE_SHARED_LINKER_FLAGS=$linker" \
            "-DCMAKE_MODULE_LINKER_FLAGS=$linker" \
            -DCMAKE_JOB_POOLS=link=1 \
            -DCMAKE_JOB_POOL_LINK=link \
            -DFOUNDATION_V2_SOURCE=${{ github.workspace }}/build/go-foundation-v2

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build/release -A x64
          -DBUILD_TESTING=ON
          -DFOUNDATION_WARNINGS_AS_ERRORS=ON
          "-DLLVM_DIR=$env:LLVM_DIR"
          -DFOUNDATION_V2_SOURCE=${{ github.workspace }}/build/go-foundation-v2

      - name: Build
        run: cmake --build build/release --config Release

      - name: Verify self-hosted compiler
        run: >-
          cmake --build build/release --config Release
          --target foundation_selfhost_verify

      - name: Prepare package locks
        if: runner.os != 'Windows'
        run: >-
          cmake
          -DCOMPILER=${{ github.workspace }}/build/release/foundationc
          -DROOT=${{ github.workspace }}
          -P tests/prepare-host-locks.cmake

      - name: Prepare package locks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake
          "-DCOMPILER=${{ github.workspace }}/build/release/Release/foundationc.exe"
          "-DROOT=${{ github.workspace }}"
          -P tests/prepare-host-locks.cmake

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build/release -C Release --output-on-failure --parallel 4

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64
          ctest --test-dir build/release -C Release --output-on-failure --parallel 4 || exit /b 1

      - name: Package Unix SDK
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$RUNNER_ARCH" in
            X64) architecture=x86_64 ;;
            ARM64) architecture=aarch64 ;;
            *) echo "unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          cmake \
            -DBUILD_DIRECTORY="$GITHUB_WORKSPACE/build/release" \
            -DOUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/release-assets" \
            -DARCHIVE_NAME="foundation-${TAG#v}-${PLATFORM}-${architecture}" \
            -DEXECUTABLE_SUFFIX= \
            -P tools/release/package-sdk.cmake

      - name: Check Unix SDK outside the build machine
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -xzf build/release-assets/foundation-*.tar.gz -C "$RUNNER_TEMP/sdk"
          sdk=$(find "$RUNNER_TEMP/sdk" -mindepth 1 -maxdepth 1 -type d)
          if [ "$RUNNER_OS" = Linux ]; then
            docker run --rm -v "$sdk:/sdk:ro" -v "$GITHUB_WORKSPACE/tools/release:/check:ro" ubuntu:24.04 \
              sh -c 'apt-get update -qq && apt-get install -qq -y --no-install-recommends gcc libc6-dev >/dev/null && sh /check/check-sdk.sh /sdk "$0"' "${TAG#v}"
          else
            if otool -L "$sdk"/bin/* | grep -v -E '^[^[:space:]]|^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo "SDK binaries link libraries outside the system" >&2
              exit 1
            fi
            sh tools/release/check-sdk.sh "$sdk" "${TAG#v}"
          fi

      - name: Package Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:RUNNER_ARCH -ne "X64") {
            throw "unsupported runner architecture $env:RUNNER_ARCH"
          }
          $version = $env:TAG.Substring(1)
          cmake `
            "-DBUILD_DIRECTORY=$env:GITHUB_WORKSPACE/build/release" `
            "-DOUTPUT_DIRECTORY=$env:GITHUB_WORKSPACE/build/release-assets" `
            "-DARCHIVE_NAME=foundation-$version-windows-x86_64" `
            -DEXECUTABLE_SUFFIX=.exe `
            -DCONFIG=Release `
            -P tools/release/package-sdk.cmake

      - name: Upload Unix assets
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" build/release-assets/* --clobber

      - name: Upload Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Get-ChildItem build/release-assets/* | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" = 6
          gh release edit "$GITHUB_REF_NAME" --draft=false
